march:
  tdd-fishbowl-session:
    title: TDD Fishbowl
    description: |-
      [Stuart Eccles](http://madebymany.com/people/stuart-eccles), fresh from talking
      about [Conan the Deployer](https://github.com/madebymany/conan) at our [February
      Meeting](/meetings/2012/february/), has offered to organise
      a [Fishbowl](http://en.wikipedia.org/wiki/Fishbowl_(conversation)) session focussing
      on approaches to TDD.

      The idea is not to focus on tedious tool debates like Test::Unit vs. RSpec or
      Cucumber vs. raw ruby for integration testing; these debates have rang throughout
      the ages and will continue to do so.  We want to explore other debates, such
      as Obie Fernandez's [suggestion that TDD might not be the best approach for
      early-stage startups](http://blog.obiefernandez.com/content/2011/07/the-next-big-leap.html).

      The format on the night will be that we'll have a couple of short opening statements
      from the panel to seed the discussion and then get going on the discussion.  The
      fishbowl format means that we have 5 chairs at the front, 1 of which is empty.  People
      on the chairs can speak, and if someone from the audience wants to add something
      to the conversation, they can go up and take the empty chair.  As soon as this
      happens, one of the original panelists must go and sit down.

      The initial panel will be:

      * [Stuart Eccles](http://twitter.com/stueccles) - Writing tests before validating
      the business value is pointless
      * [Tom Stuart](http://twitter.com/tomstuart) - Rails encourages you to to TDD
      wrong
      * [Joseph Wilk](http://twitter.com/josephwilk) - The cargo culting of TDD without
      considering if and why
      * [Tom Stuart](http://twitter.com/mortice) - The "fast specs" paradigm is a
      red herring for producing better code

      [Murray Steele](http://twitter.com/hlame) will act as moderator, but anyone
      can get involved by claiming the empty fifth chair.
    speaker:
      - name: Stuart Eccles
        url: http://twitter.com/stueccles
      - name: Tom Stuart
        url: http://twitter.com/tomstuart
      - name: Joseph Wilk
        url: http://twitter.com/josephwilk
      - name: Tom Stuart
        url: http://twitter.com/mortice
      - name: Murray Steele
        url: http://twitter.com/hlame
    coverage:
      - type: skillsmatter-video
        url: https://skillsmatter.com/podcast/ajax-ria/lrug-tdd-fishbowl
        title: 'Skills Matter : London Ruby User Group:TDD Fishbowl'
    use_description_as_intro: true
april:
  demystifying-druby:
    title: Demystifying dRuby
    description: |-
      dRuby stands for "Distributed Ruby" and it's one of less known Ruby
      standard libraries.  It is one of the first use of Metaprogramming
      long before Rails. dRuby creates proxy objects which lets you to
      "automagically"(In Matz's word) delegate method calls to remote objects.
      While I was translating [The dRuby Book: Distributed and Parallel Computing with
      Ruby](http://pragprog.com/book/sidruby/the-druby-book) from Japanese to English, I had
      a chance to work with [Masatoshi Seki](https://github.com/seki), one of the Ruby core
      committers and has been using Ruby since version 1.2. I learnt a lot of interesting Ruby
      technique from him and would like to share some of them with you.
    speaker:
      name: Makoto Inoue
      url: https://twitter.com/makoto_inoue
    coverage:
      - type: handout
        url: https://github.com/makoto/demystifying_druby_lrug_april_2012
        title: Sample code (including original 160 line version of dRuby)
      - type: slides
        url: http://drubylrug.heroku.com
        title: Demystifying dRuby
      - type: skillsmatter-video
        url: https://skillsmatter.com/podcast/home/demestifying-druby
        title: 'Skills Matter : London Ruby User Group: Demystifying dRuby'
    custom_intro: "is going to talk to us about
      [dRuby](http://www.ruby-doc.org/stdlib-1.9.3/libdoc/drb/rdoc/DRb.html)"
  converting-a-rails-project-from-mri-to-jruby:
    title: Converting a Rails project from MRI to JRuby
    description: |-
      Starting from a scaffold Rails app with RSpec and mysql/postgresl
      what are the steps to get rspec to pass on JRuby:

      * use `.rvmrc`` to switch between MRI and JRuby
      * switch out gems (db, server side js, `factory_girl` 3 vs. 2)
      * `require_relative` => use proper load path
      * using 1.9 compatible mode for new style hashes
      * waiting for `rspec` takes longer ...
      * use JRuby to connect to a Java lib (e.g. HBase jar) :-)
    speaker:
      name: Peter Vandenabeele
      url: http://vandenabeele.com/
    coverage:
      - type: handout
        url: https://github.com/petervandenabeele/LRUG_2010_04_demo
        title: Github Repo for demo project used in presentation
