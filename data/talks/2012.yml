january:
  i18n:
    title: 'I18n'
    description: |-
      The talk is about lessons learned localising a rails app into nine
      different languages. It will cover:

      * Why we localised our app
      * Why you might want to use rails i18n even if you're only planning one language
      * A little bit about how the i18n gem works for those unfamiliar with it
      * Common problems you'll have and ways to work around them

      The app we localised is [http://www.kyero.com](http://www.kyero.com/) and the
      tool we've built to help us and other ruby / rails devs using the i18n gem
      in [http://localeapp.com](http://localeapp.com/).
    speaker:
      name: Chris McGrath
      url: https://twitter.com/chrismcg
    coverage:
      - type: skillsmatter-video
        url: https://skillsmatter.com/skillscasts/2936-i18n
        title: "SkillsMatter Skillscast : London Ruby User Group : I18n"
  judge-client-side-form-validation-for-rails-3:
    title: 'Judge'
    description: |-
      I'll talk about building [Judge](https://github.com/joecorcoran/judge), a client side
      form validation gem for Rails 3.  I'll explain how I've tried to keep it lightweight
      and unassuming, why I ditched jQuery in favour of plain old JavaScript and
      what I learned about Rails i18n, form builders and HTML data
      attributes along the way.  I'll also give a brief introduction to
      [Travis](http://travis-ci.org/), the distributed build system that I've been using for
      continuous integration.
    speaker:
      name: Joe Corcoran
      url: http://blog.joecorcoran.co.uk/
    coverage:
      - type: slides
        url: http://presentations.joecorcoran.co.uk/judge_lrug/
        title: 'Judge: Client-side form validation in Rails 3'
      - type: skillsmatter-video
        url: https://skillsmatter.com/podcast/home/judge
        title: "SkillsMatter Skillscast : London Ruby User Group : Judge: Client side form
          validation for rails 3"
