          from MRI to JRuby"
    custom_intro: wants to talk to us about his experiences converting an Ruby on Rails
      app from MRI Ruby to JRuby
may:
  rubys-bin-men-a-closer-look-at-the-garbage-collector:
    title: 'Ruby''s bin men: a closer look at the garbage collector'
    description: |-
      [Elise Huard](http://jabberwocky.eu/) is going to give us a version of the talk she has
      proposed for [EuRuKo 2012](http://www.euruko2012.org/):

      > The Garbage Collector: how does it work?
      > What does it mean when people speak about stop-the-world,
      > mark-and-sweep, generational garbage collectors?
      > How does ruby fare at collecting its own garbage?
      > What does it mean when they say 1.9.3's garbage collector has improved?
      > This talk will explain those concepts, what the impact of garbage
      > collection is on our programs, and what future could be.

      This description is taken from her [pull request on EuRuKo's github-based
      cfp](https://github.com/euruko2012/call-for-proposals/pull/73).  If you like her talk, or
      have any comments, feel free to get involved over there to let the EuRuKo organisers know
      that they should select it.
    speaker:
      name: Elise Huard
      url: http://jabberwocky.eu/
    coverage:
      - type: skillsmatter-video
        url: https://skillsmatter.com/podcast/ajax-ria/ruby-bin-men
        title: "SkillsMatter Skillscast : London Ruby User Group : Ruby's bin men: a closer look
          at the garbage collector"
    use_description_as_intro: true
  dependency-injection-the-dependency-inversion-principle-and-you:
    title: Dependency Injection, the Dependency Inversion Principle, and You
    description: |-
      [Tom Stuart](http://tomstuart.co.uk/) is also going to give us a version of his EuRuKo
      proposal:

      > It's received wisdom that Ruby doesn't need dependency injection
      > frameworks. In this talk, I'll claim that this is at least in
      > part because we don't apply the [Dependency Inversion
      > Principle](http://www.objectmentor.com/resources/articles/dip.pdf)
      > properly. I'll explore the intent of the principle, its benefits
      > for maintainable and testable code, and show how to improve
      > existing code through its application.
      >
      > I'll then go on to explore how to create objects with dependencies
      > wired in, hoping to settle the question of whether we need a framework to do this.

      Tom's talk is also available for discussion on the [EuRuKo gothub-based
      CFP](https://github.com/euruko2012/call-for-proposals/pull/72).  Comments, notes, etc.. should
      go there if you have them.
    speaker:
      name: Tom Stuart
      url: http://tomstuart.co.uk/
    coverage:
      - type: skillsmatter-video
        url: https://skillsmatter.com/podcast/ajax-ria/dependency-injection
        title: 'Skills Matter : London Ruby User Group: Dependency Injection, the Dependency
          Inversion Principle and You!'
    use_description_as_intro: true
june:
  introduction-to-elasticsearch:
    title: Introduction to Elasticsearch
    description: |-
      Most apps need some form of search or filtering at some point
      (even if they don't need full text). [Elasticsearch](http://www.elasticsearch.org/) is
      a new(ish) search engine built on top of [Lucene](http://lucene.apache.org/) with some
      interesting features that set it apart from other search engines such as sphinx or solr.

      I'll show what we've used elasticsearch for and why we picked it over
      competing solutions such as solr or sphinx.
    speaker:
      name: Frederick Cheung
      url: http://spacevatican.org/
    coverage:
      - type: slides
        url: https://s3-eu-west-1.amazonaws.com/fred-misc/es-lrug.pdf
        title: Elasticsearch - LRUG June 2012 - Frederick Cheung
      - type: skillsmatter-video
        url: https://skillsmatter.com/podcast/ajax-ria/elasticsearch
        title: "SkillsMatter Skillscast : London Ruby User Group : ElasticSearch"
    custom_intro: |-
      came back from [RailsConf](http://railsconf2012.com/) with two things.  The first was one of
      the [2012 Ruby Hero awards](http://youtu.be/tWmh4m2a4FI?t=12m38s), and the second was that
      he was fired up to give a talk to his local user group. Who are we to say no to a Ruby Hero?
      Exactly, so he's going to tell us about [Elasticsearch](http://www.elasticsearch.org/)
  hexagonal-rails:
    title: Hexagonal Rails
    description: |-
      The things that make Rails great in the first few weeks of a new project are
      precisely what makes it hurt after a few months. Anyone who has worked on a
      medium-sized Rails app will have experienced pain like:

      * High coupling, meaning you have to run all your tests all the time to check
      each change.
      * Slow tests.
      * Logic littered in view templates or helper modules.

      Changes get more and more expensive to make, and the fun grinds to a halt.
      How can you stop this from happening? And more importantly, how can you turn
      around a project that’s already hit this wall of pain?

      You need to pull your app away from Rails.

      In this practical talk, we describe [an
      architecture](http://c2.com/cgi/wiki?PortsAndAdaptersArchitecture) for mature Rails
      applications where the framework becomes a
      [plug-in](http://confreaks.com/videos/759-rubymidwest2011-keynote-architecture-the-lost-years)
      to your application. With hands-on demonstrations, you’ll learn how to define clear
      boundaries between your application’s domain and Rails’ domain. Now Rails can stick
      to doing what it does best – providing the persistence and HTTP stack –
      and your valuable business logic will be in [plain
      old](http://blog.steveklabnik.com/posts/2011-09-06-the-secret-to-rails-oo-design) [Ruby
      objects](http://devblog.avdi.org/2011/11/15/early-access-beta-of-objects-on-rails-now-available-2/)
      that are [fast](http://arrrrcamp.be/videos/2011/corey-haines---fast-rails-tests/) to
      [test](https://www.destroyallsoftware.com/screencasts/catalog/fast-tests-with-and-without-rails)
      and easy to reason about.
    speaker:
      - name: Matt Wynne
        url: mattwynne.net
      - name: Steve Tooke
        url: https://twitter.com/tooky
    coverage:
      - type: skillsmatter-video
        url: https://skillsmatter.com/podcast/ajax-ria/hexagonal-rails
        title: "SkillsMatter Skillscast : London Ruby User Group : Hexagonal Rails"
    custom_intro: |-
      are going to give us a version of their Hexagonal Rails talk (which they'll
      also be giving at [SRC](http://scottishrubyconference.com/) and
      [Goruco](http://goruco.com/) later this year)
july:
  happier-deployments-through-gradual-feature-rollout:
    title: Happier deployments through gradual feature rollout
    description: |-
      Releasing a big change to an application, whether a large overhaul of
      the UX, system migration or upgrade to the internals, can be daunting.
      Will the change work technically? Will it make your users happy and
      improve the desired metrics? This talk discusses strategies and
      technologies you can use to gradually roll changes out to gather early
      feedback and prove your assumptions. It includes in-depth looks at
      some technologies available (including the [rollout](https://github.com/jamesgolick/rollout)
      gem), as well as the part that gradual feature rollout has to play within
      your agile process.

      These are all true stories, most of which I've been involved in. I'll
      cover experiences of products and projects of varying sizes, talk
      about different solutions for different environments and, just to be
      fair, I include the humiliating (character-building) mistakes I've
      made along the way.
    speaker:
      name: Sam Phillips
      url: http://samsworldofno.com/
    coverage:
      - type: skillsmatter-video
        url: https://skillsmatter.com/podcast/home/lrug-happier-deployments
        title: "SkillsMatter Skillscast : London Ruby User Group : Happier deployments through
          gradual feature rollout"
    custom_intro: is going to tell us all about feature switching
  what-ruby-cant-do:
    title: What Ruby can't do
    description: |-
      Ruby is an amazing language, it has an beautiful object model, a
      concise syntax and it allows you to write functional code
      elegantly. It's probably one of the most powerful programming
      languages out there, yet, there are still some things it cannot
      do. Let's explore those aspects because it'll open our minds to
      think differently but most important, because it's fun!
    speaker:
      name: J. Pablo Fernádez
      url: http://pupeno.com/
    coverage:
      - type: skillsmatter-video
        url: https://skillsmatter.com/podcast/home/what-ruby-cant-do
        title: "SkillsMatter Skillscast : London Ruby User Group : What Ruby can't do"
    custom_intro: is going to show us what ruby *can't* do
august:
  cut-and-polish-crafting-gems:
    title: 'Cut and Polish: Crafting Gems'
    description: |-
      Gems underpin almost every piece of Ruby code we write – and so, being
      able to write your own gems is not only incredibly useful, it provides
      an avenue for code reuse and open source sharing. I'll be talking about
      the ecosystem around gems and the fundamentals for writing your own gem
      from the ground up, plus some of the tools available to assist with
      this, along with ideal approaches and best practices for gem
      development.
    speaker:
      name: Pat Allan
      url: http://freelancing-gods.com/
    coverage:
      - type: skillsmatter-video
        url: https://skillsmatter.com/podcast/home/cut-and-polish-crafting-gems-a-talk-about-how-to-write-your-own-rubygems
        title: "SkillsMatter Skillscast : London Ruby User Group : Cut and Polish: Crafting Gems"
    custom_intro: is going to tell us all about writing [rubygems](http://rubygems.org/)
  nil-points-a-talk-about-nothing-null-undefined-maybe-and-other-ghosts-in-ruby-and-beyond:
    title: 'Nil points: a talk about nothing, NULL, undefined, Maybe, and other ghosts
      in Ruby and beyond'
    description: |-
      `nil` in Ruby is neat, simple, and convenient. But it's also problematic.
      It infiltrates our code, silently, until boom! 'undefined method `foo`
      for `nil`:`NilClass`' (or - true story, there's no time to explain -
      suddenly thousands of Mark Zuckerbergs).

      In this talk, I take a deep dive into `nil`, `NULL`, `undefined`, Maybe and
      other ghosts in Ruby and beyond. I want uncover important concepts that
      I think are obscured by by `nil`'s convenience. And I think `nil` can be so
      corrosive it's worth asking why we need it at all. Can we eliminate it
      completely? Can it be improved?

      Sure, there are decent Ruby patterns and practices for living with `nil`,
      and I'll take a look at them. But I'll also try to illuminate `nil` by
      way of a vintage Soviet computer, Jainism, a billion dollars, a
      Peruvian tribe, and a Victorian wooden adding machine. And, since this
      is Ruby, there will some reckless live monkey-patching.
    speaker:
      name: David Nolan
      url: http://kapoq.com/
    coverage:
      - type: skillsmatter-video
        url: https://skillsmatter.com/podcast/home/nil-points-a-talk-about-nothing-null-undefined-maybe-and-other-ghosts-in-ruby-and-beyond
        title: "SkillsMatter Skillscast : London Ruby User Group : nil points: a talk about nothing,
          NULL, undefined, Maybe and other ghosts in Ruby and beyond"
    custom_intro: has an idea about `nil`
