may:
  the-art-of-code-review:
    title: The Art of Code Review
    description: |-
      Most of us do some form of code review, increasingly often through pull
      requests. Done well it can be a great tool for improving quality, sharing
      knowledge, and building a sense of cohesion in a team. Done badly it can be
      toxic. In this talk I’d like to look at the motivations for code review,
      examine research into its value, and suggest some practices on how to do it
      well.
    speaker:
      name: John Cinnamond
      url: https://twitter.com/jcinnamond
    coverage:
      - type: slides
        url: https://speakerdeck.com/jcinnamond/the-art-of-code-review
        title: The Art of Code Review
      - type: skillsmatter-video
        url: https://skillsmatter.com/skillscasts/8085-the-art-of-code-review
        title: 'Skills Matter : London Ruby User Group : The Art of Code Review'
  a-tale-of-two-deployments-machine-images-immutable:
    title: A Tale of Two Deployments - Machine Images, Immutable Servers And Green/Blue
      Deployment
    description: |-
      Imagine some of the worst things that could happen to you during `cap deploy`
      -- well, they happened to Ali on the same day, and it turned into one of the
      worst days of his life. Interestingly, Sally in the office across the street
      had the exact same issues come up during her deployment. However her team had
      invested in their infrastructure sensibly, and deployed fresh immutable
      server clusters from pre-built machine images on each deploy. She could just
      relax, as the infrastructure had been designed to filter out most problems
      that could occur during deployment. Here is their story!
    speaker:
      name: Asfand Yar Qazi
      url: http://www.thedevopsdoctors.com/
    coverage:
      - type: link
        url: http://www.thedevopsdoctors.com/blog/2016/3/6/a-tale-of-two-deployments
        title: A Tale of Two Deployments - The blog post that the speech was based on
      - type: slides
        url: https://drive.google.com/file/d/0B_eY8bjtumvEZzZBbkVHWFJXbnM/view?usp=sharing
        title: Slides to an updated version of the talk
      - type: skillsmatter-video
        url: https://skillsmatter.com/skillscasts/8086-a-tale-of-two-deployments-machine-images-immutable
        title: 'Skills Matter : London Ruby User Group : A Tale of Two Deployments -
          Machine Images, Immutable'
