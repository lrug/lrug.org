        url: https://skillsmatter.com/skillscasts/9123-london-ruby-usergroup-meetup
        title: 'Skills Matter : London Ruby User Group : Software architecture analysis
          with runtime type detection in ruby'
  ruby-as-a-learning-language:
    title: " Ruby as a Learning Language"
    description: |-
      Exploring why Ruby is one of the languages which people use to start
      learning programming.
    speaker:
      name: Claire Tran
      url: https://twitter.com/clairettran
    coverage:
      - type: skillsmatter-video
        url: https://skillsmatter.com/skillscasts/9431-ruby-as-a-learning-language
        title: 'Skills Matter : London Ruby User Group : Ruby as a Learning Language'
  an-a-b-test-is-for-life-not-just-for-christmas:
    title: An A/B test is for life, not just for Christmas
    description: |-
      A/B tests are simple: you have a change you want to make; you define what
      "conversion" is; you randomly show the change to half your users, and see
      if "conversion" goes up or down with the change. But what if the effects
      are more complex?

      I'll talk about an experiment we ran that initially targeted a single
      measure of conversion but had some knock-on effects, and how we were able
      to study them. I'll share some very easy things you can do right away to
      get more information out of your A/B tests, and hopefully convince you
      there's more to them than deciding on some copy, or the colour of a button.
    speaker:
      name: Simon Coffey
      url: https://twitter.com/urbanautomaton
    coverage:
      - type: skillsmatter-video
        url: https://skillsmatter.com/skillscasts/9433-an-a-b-test-is-for-life-not-just-for-christmas
        title: 'Skills Matter : London Ruby User Group : An A/B test is for life, not
          just for Christmas'
