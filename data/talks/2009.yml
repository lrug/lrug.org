  is-your-sysadmin-dumber-than-a-hamster:
    title: Is Your Sysadmin Dumber Than a Hamster?
    description: |-
      Or, How to automate your sysadmin out of a job, and into a more interesting job.

      [John Arundel](http://bitfieldconsulting.com/) offered to do a talk about
      [Puppet](http://reductivelabs.com/products/puppet) and
      [Chef](http://wiki.opscode.com/display/chef/) covering some or more of the
      following topics:

      * Why aren't sysadmins as smart as developers?
      * How do you build 100 servers in a day?
      * How to automate the dumb stuff
      * Why it's quicker to do things more slowly
      * How to convince your boss you need an automated infrastructure
      * Why automation gives you staging and continuous integration for free
