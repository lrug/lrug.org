  thinking-functionally-in-ruby:
    title: Thinking Functionally in Ruby
    description: |-
      During our last meeting, [Tom Stuart](http://experthuman.com/) was surprised by how
      many people (both Ruby newbies "Rails not Ruby" programmers) were asking questions
      about [Enumerable](http://www.ruby-doc.org/core/classes/Enumerable.html), e.g. what
