april:
  ruby-invoicing-framework-gem:
    title: Ruby Invoicing Framework Gem
    description: |-
      [Martin Kleppmann](http://www.yes-no-cancel.co.uk/) is the author of the [invoicing
      gem](http://ept.github.com/invoicing) (on [GitHub](http://github.com/ept/invoicing))
      and is going to give a talk about it. The invoicing gem provides a solid basis
      for any commercial web app, by solving the standard problems of financial transactions
      neatly and concisely, allowing you to focus on the business logic, and being
      flexible enough to grow and handle pretty complex stuff when you need it: multi-currency
      support, international taxation and reseller networks, for example. Under the
      hood it's basically a full accrual accounting system, but that is hidden behind
      a clean Ruby API which requires no accounting knowledge. Martin will also touch
      on [OAccounts](http://ept.github.com/oaccounts), an initiative to create an
      open standard for exchanging accounting data between different apps.
    speaker:
      name: Martin Kleppmann
      url: http://www.yes-no-cancel.co.uk/
    coverage:
      - type: skillsmatter-video
        url: https://skillsmatter.com/skillscasts/666-invoicing-gem
        title: "SkillsMatter Skillscast : London Ruby User Group : Ruby Invoicing Framework Gem"
