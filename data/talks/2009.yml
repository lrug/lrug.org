  treetop:
    title: Treetop
    description: |-
      Regular expressions are great but they're unreadable when complex, and
      there are some things they just can't do. The alternative is to build
      a language parser - but that's really hard, isn't it? In this talk,
      I'll try and dispell that idea and show how building little languages
      in ruby is really simple. I'll show two examples: defining a
      mini-language from scratch to build XMPP bots, and using it as part of
      your screen-scraping toolbox.
    speaker:
      name: Roland Swingler
      url: http://knaveofdiamonds.tumblr.com/
    coverage:
      - type: skillsmatter-video
        url: https://skillsmatter.com/skillscasts/722-treetop
        title: "SkillsMatter Skillscast : London Ruby User Group : Treetop"
    custom_intro: "has been looking at [Treetop](http://treetop.rubyforge.org/)"
  implementing-scheme-in-ruby:
    title: Scheme
    description: |-
      [Scheme](http://groups.csail.mit.edu/mac/projects/scheme/) is a
      member of the [Lisp](http://en.wikipedia.org/wiki/Lisp_programming_language)
      family of languages, and is an excellent place to start if you're interested
      in writing your own language. It's small and simple to parse, yet has several
      advanced features that are only now becoming mainstream. Based on
      [Heist](http://github.com/jcoglan/heist/), my main interpreter project, I present
      a brief overview of Scheme and use [Treetop](http://treetop.rubyforge.org/) to
      create a small runtime that includes booleans, integer arithmetic, variables,
      user-defined functions, conditionals, recursion and lexical closures.
    speaker:
      name: James Coglan
      url: http://blog.jcoglan.com/
    coverage:
      - type: skillsmatter-video
        url: https://skillsmatter.com/skillscasts/723-implementing-scheme-in-ruby
        title: "SkillsMatter Skillscast : London Ruby User Group : Implementing Scheme in Ruby"
    custom_intro: "is writing a [Scheme interpreter in Ruby](http://github.com/jcoglan/stickup)"
