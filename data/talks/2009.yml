september:
  coding-dojo:
    title: Coding Dojo
    description: |-
      For this meeting we'll be running a [Coding
      Dojo](http://codingdojo.org/cgi-bin/wiki.pl?WhatIsCodingDojo).  You can find out
      much more detail on these at the [Coding Dojo wiki](http://codingdojo.org/), but
      the basic idea is as follows:

      > The Dojo starts with the definition of a problem to be worked on.  It'll be something
      > relatively simple, but with enough scope for plenty of interesting choices to be made
      > about the design.  We'll have one laptop connected to a projector and two developers
      > will pair on it to iterate towards a solution.  Every so often, the "driving" developer
      > (the one at the keyboard) will sit down, the other developer will become the "driver"
      > and another member of the group will step up to complete the pair.  Lather,
      > rinse, repeat.

      For our Dojo, because the group is so large, we plan to split the attendees on
      the night into 2 or 3 groups to work on the problem and will time the "every so
      often" such that everyone should get a turn at the laptop.  To help speed up the
      splitting into groups on the night [you should add your name to a team on our
      spreadsheet](http://spreadsheets.google.com/ccc?key=0Ai86AO7glNC9dFg4cEJkSUhOaEpCT0VHNnlWYnFld0E&hl=en_GB).
      To frame the Dojo-ing we'll introduce the concept of Dojo's at the start of the
      evening in a bit more detail, as well as describe the problem to be worked on,
      and then at the end of the meeting, we'll go round each group and let them say
      how they found the experience and describe their solution.  There'll also be
      one or two people floating around not participating, but making sure that the
      Dojo is running smoothly and giving advice to groups struggling.

      Hopefully everyone gets a turn at the laptop and so everyone will write some
      code on the night.  We hope it'll be a good way of letting inexperienced developers
      see how more experience developers approach problems and hopefully learn a lot
      by watching and working with them.  Of course, those experienced developers will
      also get a chance to be pulled up on things and forced to think outside of their,
      perhaps, fixed mindsets.

      There are still some details to be thrashed out, like what the problem will be,
      and how to split the meeting up into groups to ensure a even spread of ability
      in each group (see the
      [spreadsheet](http://spreadsheets.google.com/ccc?key=0Ai86AO7glNC9dFg4cEJkSUhOaEpCT0VHNnlWYnFld0E&hl=en_GB)).
      We'll discuss all that on [the mailing list](/mailing-list), so do sign up and
      follow along.

      The idea for this meeting wouldn't have been possible without help from
      [Matt Wynne](http://blog.mattwynne.net/) and [Ivan Sanchez](http://isanchez.net/),
      who have both run Dojo's in the past and will be helping out on [the mailing
      list](/mailing-list) and on the evening itself.

      The code produced by each of the 3 groups is available on the [LRUG github
      account](http://github.com/lrug):

      * [Pirates](http://github.com/lrug/kata-minesweeper/tree/lrug-pirate-group)
      * [Ninjas](http://github.com/lrug/kata-minesweeper/tree/lrug-ninja-group)
      * [Zombies](http://github.com/lrug/kata-minesweeper/tree/lrug-zombie-group)
    speaker:
      - name: Murray Steele
        url: http://h-lame.com
      - name: Matt Wynne
        url: http://blog.mattwynne.net/
      - name: Ivan Sanchez
        url: http://isanchez.net/
    coverage:
      - type: skillsmatter-video
        url: https://skillsmatter.com/skillscasts/973-coding-dojo-973
        title: "SkillsMatter Skillscast : London Ruby User Group : Coding Dojo"
    use_description_as_intro: true
