    title: Cucumber, Celerity, & FireWatir
    description: |-
      The talk will explain Story-Driven-Development(SDD) and its benefits.
      A sample application will be built in real-time using SDD with [Rspec](http://rspec.info/)
      [Cucumber](http://cukes.info). Tests will be run in-browser with
      [FireWatir](http://wiki.openqa.org/display/WTR/FireWatir) and through a headless-browser
      using [Celerity](http://celerity.rubyforge.org/) and [JRuby](http://jruby.codehaus.org/).
