march:
  redcar-ruby-gnome-and-textmate:
    title: 'Redcar: Ruby, Gnome and Textmate'
    description: |-
      [Daniel Lucraft](http://daniellucraft.com/) has been building
      [Redcar](http://www.redcaride.com/) for some time now and wants to talk about it:

      > Redcar is a programmer's text editor for Gnome, written in Ruby. In this talk I'll
      > show off Redcar's features, and then take a look into how it's implemented. We'll also
      > look at the [Ruby-GNOME2](http://ruby-gnome2.sourceforge.jp/) bindings, and how to
      > interface [Vala](http://live.gnome.org/Vala) (a C# like language) with Ruby for performance.

      Daniel's even hoping to push his first milestone release of Redcar just before the
      meeting.  You can track his progress [on the Redcar lighthouse
      project](http://redcar.lighthouseapp.com/projects/25090-redcar/milestones).
    speaker:
      name: Daniel Lucraft
      url: http://daniellucraft.com/
    coverage:
