      > [Test:Unit](http://www.ruby-doc.org/stdlib/libdoc/test/unit/rdoc/classes/Test/Unit.html),
      > [RSpec](http://rspec.info/), [Capistrano](http://capify.org/), and a few
      > other things through it, and it currently has about [74% C0
      > coverage](http://eigenclass.org/hiki.rb?rcov) and a 2:1 Test:Code ratio.
      >
      > I'm also pretty exhausted, and now have the joy of wrangling real
      > users.
