  mobileact:
    title: "mobileAct: a high-risk Rails app for Channel 4"
    description: |-
      [Thomas Pomfret](http://mintdigital.com/) is going to give us a trailer
      version of his [Scotland On Rails
      talk](http://www.scotlandonrails.com/talks#mobileact_a_highrisk_rails_app_for_channel_4).
