      > recording deal. "mobileAct: a high-risk Rails app for Channel 4" will
      > report back on Mint's experiences building this mass-market application.
      > In the light of recent TV voting scandals, the spotlight was on voting.
      > In a very public arena, we had to make sure not only that the vote was
      > fair, but that it could be seen to be fair.

      So we can expect his "trailer" to cover some or all of that.
    speaker:
