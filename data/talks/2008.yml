march:
  challenges-in-making-ruby-run-effectively-on-a-jvm:
    title: Challenges in making Ruby run effectively on a JVM
    description: |-
      [Kresten Krab Thorup](http://www.version2.dk/blogs/krestenkrabthorup),
      track host and speaker at both
      [QCon](http://qcon.infoq.com/london/tracks/show_track.jsp?trackOID=86)
      and [RubyFools](http://jaoo.dk/ruby-cph/tracks/show_track.jsp?trackOID=106),
      will provide an overview of the issues, trade-offs and challenges in
      making dynamic object-oriented languages run effectively; both in general,
      and specifically making Ruby run well on the JVM.  Kresten has many years
      deep knowledge of getting the most out of a JVM, and has recently been
      working on an research project on building yet another JVM-based virtual
      machine for Ruby and thus, the talk is organized around issues and
      findings in building this virtual machine.
    speaker:
