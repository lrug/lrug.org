          high-risk Rails app for Channel 4"
      - type: google-video
        url: http://video.google.com/videoplay?docid=4044506860593865662
        title: "SkillsMatter Skillscast : London Ruby User Group : mobileAct: a
          high-risk Rails app for Channel 4"
    use_description_as_intro: true
  handling-long-running-tasks-in-rails:
    title: Handling Long-Running Tasks in Rails
    description: |-
      [Andrew Stewart](http://blog.airbladesoftware.com/) is also talking at
      [Scotland On Rails](http://www.scotlandonrails.com/talks#handling_longrunning_tasks_in_rails)
      and so as not to be shown up by Thomas's extra preparation is also going to
      give us a trailer for his talk, described on the conference site as follows:

      > Rails is a web framework and thus designed for HTTP's synchronous
      > request and response: you make a request to the application, the
      > application executes it and returns the response. For your application
      > to feel snappy its filters and actions should take no more than a few
      > milliseconds to execute. But what do you do if you need to run a task
      > that takes more than a few milliseconds?  Perhaps ten minutes or even
      > longer? You need to move execution off the request-response thread and
      > onto a different one.
      >
      > Rails doesn't support this out of the box and it's not obvious how to do
      > this correctly. Happily a number of plugins fill the gap. They all work
      > differently, though, and cater for different situations. The one you
      > need for your application depends on your situation.
      >
      > This session lays out all your options and explains where each plugin is
      > best suited. It shows you how to work with each plugin. By the end you
      > will be able to make an informed decision about which one you need in
      > any given situation - and how to use it well.

      We obviously can't expect a "trailer" to cover all the plugins and
      solutions out there, but it's bound to cover some of them.
    speaker:
      name: Andrew Stewart
      url: http://blog.airbladesoftware.com/
    coverage:
      - type: skillsmatter-video
        url: https://skillsmatter.com/podcast/ajax-ria/handling-long-running-tasks-in-rails
        title: "SkillsMatter Skillscast : London Ruby User Group : Handling long-running
          tasks in Rails"
      - type: google-video
        url: http://video.google.com/videoplay?docid=5044315308846114666
        title: "SkillsMatter Skillscast : London Ruby User Group : Handling long-running
          tasks in Rails"
    use_description_as_intro: true
april:
  show-n-tell:
    title: Show'n'Tell
    description: |-
      <a href="http://www.flickr.com/photos/snowblink/2420964953/"
      title="Pen Twirling Tom (20080414-R0010620.jpg) by snowblink, on Flickr">
      <img src="http://farm3.static.flickr.com/2326/2420964953_e700c5ceaf_m.jpg"
      width="240" height="240" alt="Pen Twirling Tom (20080414-R0010620.jpg)"
      /></a>

      Lots of people have probably written code (be it gems, rails plugins,
      collections of rake tasks or little itch-scratcher scripts) that they're
      kinda proud of, but don't really want to pad out a 5-10 minute demo /
      show-off into one of our "traditional" 20-30 minute talks, so we never get
      to hear about it. As a community we're probably missing out on a lot of
      sweet ruby goodness because of that.

      This month we hope to change that by running a bunch of Show'n'Tell
      sessions where people show off their code for 5-10 mins.  There's no set
      idea on what you should show off: perhaps a neat function you're really
      proud of, perhaps a whole gem, perhaps just some `.irbrc` hacks that you
      think are super useful. Anything goes, as long as it's code.

      Some people that have volunteered so far:

      * [James Adam](https://interblah.net) - [soup](http://github.com/lazyatom/soup) and
        [vanilla](http://github.com/lazyatom/vanilla-rb)"
      * [Daniel Lucraft](http://daniellucraft.com) - [rak](http://rak.rubyforge.org/)"
      * [Alex MacCaw](http://www.eribium.org) - [juggernaut](http://juggernaut.rubyforge.org/)"
      * [Rob McKinnon](https://github.com/robmckinnon) -
        [morph](http://github.com/robmckinnon/morph)
        ([slides](http://www.slideshare.net/delineator/data-code-lrug-april-2008))"
      * [Sean O'Halpin](https://github.com/seanohalpin) - [doodle](http://doodle.rubyforge.org/)"
      * [Dan Webb](http://danwebb.net/) - "Fiddling with [god](http://god.rubyforge.org/)" (perhaps
        with a [starling](http://rubyforge.org/projects/starling/))'

      There's plenty of room for more stuff, so [get in touch](/mailing-list) to
      volunteer something.
    speaker:
      - name: James Adam
        url: https://interblah.net
      - name: Daniel Lucraft
        url: http://daniellucraft.com
      - name: Alex MacCaw
        url: http://www.eribium.org
      - name: Rob McKinnon
        url: https://github.com/robmckinnon
      - name: Sean O'Halpin
        url: https://github.com/seanohalpin
      - name: Dan Webb
        url: http://danwebb.net/
    coverage:
      - type: skillsmatter-video
        url: http://skillsmatter.com/podcast/ajax-ria/demos-soup-vanilla-rak-juggernaut-doodle-and-more
        title: "SkillsMatter Skillscast : London Ruby User Group : Show'n'tell demos
          of soup, vanilla, rak, juggernaut, doodle, and more"
      - type: google-video
        url: http://video.google.com/videoplay?docid=-2485256619067067324
        title: "SkillsMatter Skillscast : London Ruby User Group : Show'n'tell demos
          of soup, vanilla, rak, juggernaut, doodle, and more"
      - type: slides
        url: http://www.slideshare.net/delineator/data-code-lrug-april-2008
        title: "Rob McKinnon : code == data - an introduction to morph"
    use_description_as_intro: true
