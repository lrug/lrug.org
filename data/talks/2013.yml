        title: 'Skills Matter : London Ruby User Group : Scaling beyond Rails'
october:
  modelling-state-machines-with-ragel:
    title: Modelling state machines with Ragel
    description: |-
      Ragel is a State Machine Compiler, which can generate Ruby
      code (as well as C, Java, Go, and more). It can be used for
      writing robust protocol implementations, parsing data formats,
      and performing lexical analysis of programming languages. Ragel
      is used in many open source projects including
      [Gherkin](https://github.com/cucumber/gherkin/blob/master/ragel/lexer_common.rl.erb),
      [Thin](https://github.com/macournoyer/thin/blob/master/ext/thin_parser/parser.rl),
      [Min](https://github.com/macournoyer/min/blob/master/src/min/lang/Scanner.rl),
      [Mongrel](https://github.com/mongrel/mongrel/blob/master/ext/http11/http11_parser_common.rl),
      [Redcloth](https://github.com/jgarber/redcloth/tree/master/ragel),
      [Radiant](https://github.com/jlong/radius/blob/master/lib/radius/parser/JavaScanner.rl),
      and
      [Hpricot](https://github.com/hpricot/hpricot/blob/master/ext/hpricot_scan/hpricot_common.rl).

      To demonstrate Ragel's capabilities we'll model [Vim](http://www.vim.org/), which is a
      Finite State Machine. We'll do so by parsing a stream of Vim
      keystrokes, using Ragel state machines to manage the transitions
      between Vim's modes. We'll see how to generate state chart
      visualisations with Ragel, and how these can be used to debug
      our state machines. The resulting program will enable us to
      analyse and visualise the interactions of a Vim user.
    speaker:
      name: Drew Neil
      url: http://drewneil.com/
    coverage:
      - type: handout
        url: https://github.com/nelstrom/ragel-vim-demo
        title: Code used in presentation
      - type: slides
        url: https://speakerdeck.com/nelstrom/modelling-state-machines-with-ragel
        title: Modelling State Machines with Ragel
      - type: skillsmatter-video
        url: https://skillsmatter.com/podcast/home/modelling-state-machines-with-ragel
        title: 'Skills Matter : London Ruby User Group : Modelling state machines with
          Ragel'
    custom_intro: "wants to talk to us about [Ragel](http://www.complang.org/ragel/)"
  enumerators-in-ruby:
    title: Enumerators in Ruby
    description: |-
      [Enumerators](http://ruby-doc.org/core-2.0.0/Enumerator.html)
      are a little known class in the standard library.
      I'll discuss where they're used in stdlib, how you can
      implement them and (at least) one practical example where
      they might be the right solution.
    speaker:
