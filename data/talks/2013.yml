      - type: skillsmatter-video
        url: https://skillsmatter.com/podcast/java-jee/building-and-maintaining-a-ruby-team-during-the-rails-crisis-of-2013
        title: 'Skills Matter : London Ruby User Group : Building and maintaing a Ruby
          team during the Rails crisis of 2013'
august:
  improve-your-code-with-dependency-injection:
    title: Improve your code with dependency injection
    description: |-
      Most of us have heard the vague, hand waving spiel about why
      DI is important for writing flexible, reusable code, a
      little harder to come by are examples of how one actually
      goes about doing it in a (cost) effective manner.

      Rather than a dry introduction to DI, this talk will be
      packed full of code examples demonstrating practical
      techniques you can start using straight away, no gems,
      meta-programming or magic required. We'll also explore how
      you might persuade your Rails app to benefit from DI.
    speaker:
      name: Stephen Best
      url: https://twitter.com/thebestie
    coverage:
      - type: skillsmatter-video
        url: https://skillsmatter.com/skillscasts/4437-improve-your-code-with-dependency-injection
        title: 'Skills Matter : London Ruby User Group : Improve your code with dependency
          injection'
  rabbit-running-wild-you-need-a-hutch:
    title: Rabbit running wild? You need a hutch!
    description: |-
      When you're working in an architecture with multiple
      services, there are a lot of available options for how to
      communicate between them. Which do you pick?

      I'll be talking about why [RabbitMQ](http://www.rabbitmq.com/) can be a great choice,
      how and why we're using it here at [GoCardless](https://gocardless.com/) and covering
      some of the ways we've simplified using RabbitMQ's
      [Topic Exchange](http://www.rabbitmq.com/tutorials/amqp-concepts.html#exchange-topic)
      in a ruby environment with 'Hutch'.

      I'll then talk about some of the issues we encountered
      around scaling and setting up multiple rabbit nodes as a
      cluster, highlighting some of the potential failure points
      and edge cases this brings with it and a tools we built to
      make sure we had them covered.
    speaker:
      name: Pete Hamilton
      url: https://twitter.com/peterejhamilton
    coverage:
      - type: skillsmatter-video
        url: https://skillsmatter.com/skillscasts/4438-rabbit-running-wild-you-need-a-hutch
        title: 'Skills Matter : London Ruby User Group : Rabbit running wild? You need
          a hutch!'
september:
  concerned-about-concerns:
    title: Concerned about Concerns?
    description: |-
      With Rails 4, Concerns have become [the “official”
      solution](http://37signals.com/svn/posts/3372-put-chubby-models-on-a-diet-with-concerns)
      to the big-models problem. However, there's a fair amount of controversy about
      this topic in the community. Not everyone is convinced that Concerns are the
      “right“ solution to the problem of AR models becoming too big.

      In this talk we will see what Rails Concerns are and how can we use them to keep
      our models fit. More interestingly, we'll discuss the trade-offs of this technique,
      the different views in the community and a couple of alternatives.
    speaker:
      name: Luismi Cavallé
      url: https://twitter.com/cavalle
    coverage:
      - type: skillsmatter-video
        url: https://skillsmatter.com/skillscasts/4514-concerned-about-concerns
        title: 'Skills Matter : London Ruby User Group : Concerned about Concerns?'
    custom_intro: wants to relieve our concerns
  scaling-beyond-rails:
    title: Scaling beyond Rails
    description: |-
      When a Rails application becomes a big fat monster, the moment arrives
      to split it into small services that speak to each other. I'll discuss how
      are we attacking this problem in a progressive, iterative way and which tools
      we chose for each situation; some of which are not limited to Ruby.
    speaker:
      name: Manuel Morales
      url: https://github.com/manuelmorales
      raw: "[Manuel Morales](https://github.com/manuelmorales) says:"
    coverage:
      - type: skillsmatter-video
