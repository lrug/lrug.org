october:
  cucumber-workshop:
    title: Cucumber Workshop
    description:
      This month we'll be having a [Cucumber](https://cucumber.io/) special.

      [Joseph Wilk](http://josephwilk.net/) will be sharing his experiences on how you should and
      shouldn't use Cucumber to test your applications, but rather than a straight forward
      presentation with him boring everyone with lots of long winded slides he's going to run the
      evening in a workshop format.  Consider it a self help group for Cucumber users where we all
      get to share things that have and have not worked for us.

      There will be some introduction patterns and case studies of good Cucumber practices that he's
      come across to get things rolling. Coming armed with your own ideas, experiences or complaints
      will help prevent us all staring at the floor and shuffling our feet.

      So if you're using Cucumber and are having problems, if you are not yet sold on it and want
      some tips, if you think its the source of all evil in the world, head along to this self help
      group. It would be great if people could share some of the ideas you have brewing in your mind
      before hand. Just get in touch with [Joseph directly](http://twitter.com/josephwilk) or [via
      the LRUG mailing list](/mailing-list) and help make this a Cuketastic (sorry) workshop!
    speaker:
      name: Joseph Wilk
      url: http://josephwilk.net/
    coverage:
      - type: skillsmatter-video
        url: https://skillsmatter.com/skillscasts/1598-cucumber-workshop
        title: "SkillsMatter Skillscast : London Ruby User Group : Cucumber Workshop"
    use_description_as_intro: true
