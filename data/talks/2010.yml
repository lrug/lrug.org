  what-every-computer-programmer-should-know-about-time:
    title: What every computer programmer should know about time
    description: |-
      I've been putting some notes together on time similar in spirit (if not in detail) to
      ["What every computer programmer should know about floating-point
      arithmetic"](http://docs.sun.com/source/806-3568/ncg_goldberg.html) ranging from
      localtime vs [UTC](http://en.wikipedia.org/wiki/Coordinated_Universal_Time), hardware
