march:
  software-craftsmanship:
    title: Software Craftsmanship
    description: |-
      This month [Chris Parsons](http://pa.rsons.org) and [Corey
      Haines](http://www.coreyhaines.com/) will be leading us in an evening of exploration
      of the ideas behind [Software Craftsmanship](http://manifesto.softwarecraftsmanship.org/).

      > Where the agile movement focused on principles for developing better software, the software
      > craftsmanship movement focuses on developing better software developers, growing out of a
      > frustration with the current state of the software development industries. Starting with
      > [Uncle Bob's keynote about 'craft over crap'][unclebob-quintessence],
      > many companies and individuals started looking at concrete ways to advance our field into
      > a true profession; the focus generally resting on two key areas: ways to effectively
      > acquire new practices and ways to bring new people into our field.Chris and Corey will be
      > presenting their thoughts on how this affects businesses and personal careers.
      >
      > With the emphasis on developer improvement, might we lose the focus on delivering business
      > value?  Chris will talk about how craftsmanship ideas have been applied at
      > [Eden](http://www.edendevelopment.co.uk/), showing there doesn't have to be a conflict
      > between these two goals.
      >
      > The terms 'apprentice' and 'journeyman' are often thrown around without really defining
      > what they mean in terms of acquiring skills and techniques.  Corey will discuss these
      > words, describing concrete definitions that go past the FUD often associated with them
      > (nobody is asking you to doff your cap or mop the floors with a toothbrush).
      >
      > We will then hold a Q&A session and answer people's questions and comments.  If there's
      > time, Corey will discuss and perform a code kata, one helpful way to practice our
      > techniques.

      [unclebob-quintessence]: http://blog.objectmentor.com/articles/2008/08/14/quintessence-the-fifth-element-for-the-agile-manifesto
    speaker:
      - name: Chris Parsons
        url: http://pa.rsons.org
      - name: Corey Haines
        url: http://www.coreyhaines.com/
    coverage:
      - type: skillsmatter-video
        url: https://skillsmatter.com/podcast/agile-scrum/chris-parsons-software-craftsmanship-ideas-eden
        title: "SkillsMatter Skillscast : London Ruby User Group : Chris Parsons Software
          Craftmanship Ideas @ Eden"
      - type: slides
        url: http://www.slideshare.net/skillsmatter/chrisparsons
        title: "Slideshare : Crafting software vs cashflow"
      - type: skillsmatter-video
        url: https://skillsmatter.com/podcast/ajax-ria/corey-haines-software-craftsmanship-terminology
        title: "SkillsMatter Skillscast : London Ruby User Group : Corey Haines Software
          Craftmanship Terminology"
      - type: slides
        url: http://www.slideshare.net/skillsmatter/coreyhaines
        title: "Slideshare : 2 ways to be a software craftsman"
    use_description_as_intro: true
