      Git has taken the Ruby world by storm, and many of us are using 'git push' on a daily basis.
      [Priit Tamboon](http://priit.mx.ee/) is going to talk about how to use git hooks and will
      highlight some everyday tips that he has developed and found useful. He's also going to talk
