    custom_intro: "has recently been working on a rails plugin called
      [ActionEmbedding](http://github.com/philcowans/action_embedding), and he'd like to
      show it to us"
august:
  making-old-projects-better:
    title: Making old projects better
    description: |-
      Most of us want better software development processes, and spend a lot of time reading and
      talking about methods for making better software. However, when you've already been working
      on a project for a long time, entropy can get the better of you, making it difficult to adapt
      your working practices. We've been working on a project like this that started 18 months ago,
      and over the last few months have been steadily improving how we go about things, getting
      better at BDD and Scrum, and starting to do a bit of Domain Driven Design. We're going to
      talk about how we got on, focusing in equal parts on refactoring legacy code bases,
      improving test coverage, and improving processes, as well as revealing the incredible powers
      of suggestion we employed to convince stakeholders, management and sundry doubters that this
      was a good idea.
    speaker:
      - name: Tim Cowlishaw
        url: http://timcowlishaw.co.uk/
      - name: Chris O'Sullivan
        url: http://thechrisoshow.com/
    coverage:
      - type: skillsmatter-video
        url: https://skillsmatter.com/skillscasts/1506-making-old-projects-better
        title: "SkillsMatter Skillscast : London Ruby User Group : Making old projects better"
    custom_intro: "have been working together on an older project of theirs and want to share some
      things they've learned about making it a nicer project to work on"
  ittybittyboom-com-and-cramp:
    title: "[ittybittyboom.com](http://ittybittyboom.com)"
    description: |-
      You'll find out how and why I use [cramp](http://github.com/lifo/cramp) to cope with hundreds
      of simultaneous players on [ittybittyboom.com](http://ittybittyboom.com).  Cramp is an
      asynchronous event driven ruby based framework based upon event machine that allows the coder
      to write succinct, clear code to deal with hundreds or thousands of tcp connections at once.
    speaker:
