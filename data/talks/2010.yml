  japanese-and-ruby:
    title: Japanese and Ruby
    description: |-
      My talk is based on an article called ["Japanese and
      OO"](http://satoshi.blogs.com/life/2004/09/post.html) which was written by a Japanese guy
      who wrote Windows 95 and his thought around what helped him to build the software as a
      Japanese. I really enjoyed the article and thought it relates to Ruby which is written by
      another Japanese (the Matz). I will also add some of my own thoughts onto the talk.
    speaker:
      name: Makoto Inoue
      url: http://twitter.com/makoto_inoue
    coverage:
      - type: skillsmatter-video
        url: https://skillsmatter.com/skillscasts/1803-japanese-and-ruby
        title: "SkillsMatter Skillscast : London Ruby User Group : Japanese and Ruby"
