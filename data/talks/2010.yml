june:
  my-first-ruby:
    title: '"My First Ruby"'
    description: |-
      [Murray Steele](http://h-lame.com/) wants to talk about the first ruby script he ever wrote,
      and he thinks you might be interested because (in his own words from the [mailing
      list](/mailing-list) thread where he proposed the talk):

      > 1. It's a mailing list with a web front-end.  The web stuff is pre-rails and I think it's
      >    interesting in terms of "look how far we've come".  Seriously, if you've never done web
      >    development without a higher-level framework like rails you'll be amazed.  (For anyone
      >    who's heard of it, it uses [NARF](http://sourceforge.net/projects/narf-lib/)).
      >
      > 2. I can pretty much guarantee that my first ruby code is worse than your first ruby code.
      >    So for any newbies in the room, it should come as welcome relief that even apparent
      >    old-hands like myself have written terrible code (and it truly is terrible code), made
      >    terrible design decisions, and done both without the safety net of TDD.  Of course,
      >    hopefully in the talk I'll point out why, if writing this again, I would use TDD.  At
      >    the end I hope this talk will make people feel less embarrassed about showing off code
      >    of their own at future events; I'll be setting a base-level of awfulness.
      >
      > 3. This bit of software was written in a weekend and has been in "production" for  7 years
      >    11 months (according to the date I filled in for "when I first started using Ruby" on my
      >    Working With Rails profile) and it's been remarkably stable and unchanged for those 7
      >    years.  I've no real evidence for this, but it's a scientific fact that it's the longest
      >    running piece of ruby software in the world... wouldn't you like to see inside it?
    speaker:
      name: Murray Steele
      url: http://h-lame.com/
    coverage:
      - type: transcript
        url: http://www.h-lame.com/talks/my-first-ruby
        title: Talks ∋ My first ruby
      - type: skillsmatter-video
        url: https://skillsmatter.com/skillscasts/1427-my-first-ruby
        title: "SkillsMatter Skillscast : London Ruby User Group : My first ruby"
    use_description_as_intro: true
  unix-rediscovering-the-wheel:
    title: 'UNIX: Rediscovering the wheel'
    description: |-
      [John Leach](http://johnleach.co.uk/) kindly offered to do a version of this talk (previously
      given at [Conferencia Rails 2009](http://www.conferenciarails.org/) and [Scottish Ruby
      Conference 2010](http://scottishrubyconference.com/)).  Originally scheduled for our [may
      meeting](/meetings/2010/04/28/may-2010-meeting/), he's going to give it this month instead.
      This is the abstract from his talk at [Conferencia
      Rails](http://app.conferenciarails.org/talks/58-unix-rediscovering-the-wheel):

      > "Those who don't understand UNIX are condemned to reinvent it, poorly."
      >
      > We in the Ruby Community seem to have a habit of re-inventing things. Sometimes this
      > is for good reason, but in some cases we don't know we're even doing it! We're wasting
      > valuable time that could be spent learning Erlang!
      >
      > UNIX-like operating systems have been around for decades and lots of problems have come
      > and gone in that time. I'm going to talk about some of the tools available that can be
      > used to solve common Ruby and Rails deployment and development problems.
    speaker:
      name: John Leach
      url: http://johnleach.co.uk/
    coverage:
      - type: skillsmatter-video
        url: https://skillsmatter.com/skillscasts/1428-unix-rediscovering-the-wheel
        title: "SkillsMatter Skillscast : London Ruby User Group : UNIX: Rediscovering the wheel"
    use_description_as_intro: true
july:
  carat-an-interpreted-language-written-in-ruby:
    title: 'Carat: An interpreted language, written in Ruby'
    description: |-
      I ended up writing an interpreter, in Ruby, for a language heavily inspired by Ruby. A sort
      of distilled Ruby-like language which is far too simplistic to be useful and probably
      overlooks tonnes of important things.

      But anyway! The point is not really that the language is utterly pointless. The point is that
      it's an interpreter written in a very high-level language, which I think it relatively easy
      to understand.

      So I'm offering to do a talk which would take the listener through the workings of this
      interpreter. The parsing is done with Treetop, although I wouldn't propose really talking
      about the parsing at all as I think a lot of people are quite familiar with Treetop.

      I might as well finish with some buzzwords. If you ever wondered what "trampoline function"
      or "continuation passing style" means then this is your chance :)
    speaker:
      name: Jonathan Leighton
      url: http://jonathanleighton.com/
      raw: "[Jonathan Leighton](http://jonathanleighton.com/) has recently completed
        a project for his third year at University, which he thinks we might be interested
        in:"
    coverage:
      - type: skillsmatter-video
        url: https://skillsmatter.com/skillscasts/1458-carat-an-interpreted-language-written-in-ruby
        title: "SkillsMatter Skillscast : London Ruby User Group : Carat: An interpreted language,
          written in Ruby"
      - type: code
        url: http://github.com/jonleighton/carat
        title: "Github : Carat"
      - type: link
        url: http://dump.jonathanleighton.com/project.pdf
        title: "Jonathan's final year report about the project"
    custom_intro: "has recently completed a project for his third year at University, which he
