    description: |-
      Some of the team ([Chris Parsons](http://chrismdp.github.com/), [Jolyon
      Pawlyn](http://www.unboxedconsulting.com/people/jolyon-pawlyn)) behind the newly launched
      [government e-petitions website](http://epetitions.direct.gov.uk/) will talk to us about
      the issues they had with scaling the site, how they solved them, and how they continue to
      monitor and improve the service:

      > A talk about caching, chef, munin, load testing and hosting. As part of its adoption of
      > agile techniques and its creation of a Skunkworks division,
      > [DirectGov](http://direct.gov.uk) asked the [Agile Delivery
      > Network](http://www.agiledelivery.net/) to build a successor website to the Number 10
      > e-petitions site with a 6 week deadline. The talk aims to highlight the measures taken to
      > cope with high throughput, what worked and what could be done differently to avoid
      > headlines like ["Government's e-petition website crashes on first
      > day"](http://www.guardian.co.uk/politics/2011/aug/04/government-e-petition-website-crashes).
    speaker:
      - name: Chris Parsons
        url: http://chrismdp.github.com/
      - name: Jolyon Pawlyn
        url: http://www.unboxedconsulting.com/people/jolyon-pawlyn
    coverage:
      - type: skillsmatter-video
        url: https://skillsmatter.com/skillscasts/2530-september-london-ruby-user-group
        title: "SkillsMatter Skillscast : London Ruby User Group : Scaling e-petitions"
    use_description_as_intro: true
october:
  lrug-battleship-ruby-fight-club:
    title: 'Battleship: Ruby Fight Club'
    description: |-
      [Paul Battley](http://po-ru.com/) has written [a game engine based on the game of
      battleships](https://github.com/threedaymonk/battleship) and will be letting us play with it.
      *Before the meeting* you should write a player for Paul's game engine and during the meeting
      we'll pit the players against each other in a tournament.  Once the winner is declared we'll
      look at the player implementations and get their authors to talk about them.  In case you
      win you should be prepared to show off your code and discuss the strategy you implemented.

      There is more information available on the [mailing list thread where Paul announced
      the event](http://lists.lrug.org/pipermail/chat-lrug.org/2011-September/006352.html).  If
      you have any questions [the mailing list](/mailing-list) is the place to ask them.

      _UPDATE_
      If you have written a player [read this missive from
      Paul](http://lists.lrug.org/pipermail/chat-lrug.org/2011-October/006510.html) and make sure
      you are prepared.

    speaker:
      name: Paul Battley
      url: http://po-ru.com/
    coverage:
      - type: code
        url: https://github.com/threedaymonk/battleship
        title: "GitHub repo for the battleships game engine"
      - type: skillsmatter-video
        url: https://skillsmatter.com/skillscasts/2698-lrug-battleship
        title: "SkillsMatter Skillscast : London Ruby User Group : LRUG Battleship: Ruby Fight
          Club"
    use_description_as_intro: true
november:
  transformers-code-blocks-in-disguise:
    title: "Transformers: Code Blocks In Disguise"
    description: |-
      [Aanand Prasad](http://aanandprasad.com/) has some Ruby code to show you. It looks a little
      strange - in fact, it doesn't even look valid.

          Array.run do
            x <- ["first", "second"]
            y <- ["once", "twice"]

            ["#{x} cousin #{y} removed"]
          end

      What does it do, and how does it do it? If you know what a macro is, or a continuation, or a
      monad, you might be able to guess. If not, don't worry - by the end, you'll probably be as
      confused as everyone else, including the speaker.
    speaker:
      name: Aanand Prasad
      url: http://aanandprasad.com/
    coverage:
      - type: slides
        url: http://transformers-talk.heroku.com/
        title: 'Transformers: Code Blocks in Disguise'
      - type: skillsmatter-video
        url: https://skillsmatter.com/skillscasts/2765-november-lrug
        title: "SkillsMatter Skillscast : London Ruby User Group : Transformers: Code Blocks In
          Disguise"
    use_description_as_intro: true
  my-adventures-in-objective-c:
    title: My Adventures in Objective-C
    description: |-
      I have been ducking Objective-C at every turn for a very long time. Who wants to learn a
      heavily typed static behemoth just to write an iPhone app?!

      So, I did what every self respecting programmer would do, throw alternative open solutions
      aka Javascript frameworks at the problem.

      But in the end I had to succumb to the will of the Almighty Apple - I needed their Objective
      C to make stuff happen ... and it wasn't that bad :)

      This is all the learning, similarities (of which there are a few) and differences between
      Objective-C and Ruby.
    speaker:
      name: Abdel A Saleh
      url: http://twitter.com/abdels
    coverage:
      - type: slides
        url: http://www.slideshare.net/abdels/my-adventuresinobjc
        title: My Adventures In Objective-C (A Rubyists Perspective)
      - type: skillsmatter-video
        url: https://skillsmatter.com/skillscasts/2826-my-adventures-in-objective-c
        title: "SkillsMatter Skillscast : London Ruby User Group : My Adventures in Objective-C"
    custom_intro: wants to tell us about his experiences of developing an iOS app
      from a Rubyists perspective
december:
  hypermedia-as-the-engine-of-application-state:
    title: HATEOAS
    description: |-
      I've been trying to understand the [HATEOAS](http://en.wikipedia.org/wiki/HATEOAS) constraint
      myself.

      [Roy Fielding's blog posts](http://roy.gbiv.com/untangled/tag/rest) are almost indecipherable
      to an ordinary developer like me. I think there's a huge gap in relevant easily accessible
      information on understanding it, and how to implement it, what it's benefits are etc.

      One of the aspects that I've found particularly confusing is the concept of not having
      out-of-band communication and having discoverable APIs.

      In [one particular blog
      post](http://roy.gbiv.com/untangled/2008/rest-apis-must-be-hypertext-driven) Roy says:

      > A REST API should be entered with no prior knowledge beyond the initial URI (bookmark) and
      > set of standardized media types that are appropriate for the intended audience (i.e.,
      > expected to be understood by any client that might use the API). From that point on, all
      > application state transitions must be driven by client selection of server-provided choices
      > that are present in the received representations or implied by the user’s manipulation of
      > those representations. The transitions may be determined (or limited by) the client’s
      > knowledge of media types and resource communication mechanisms, both of which may be
      > improved on-the-fly (e.g., code-on-demand). [Failure here implies that out-of-band
      > information is driving interaction instead of hypertext.]

      I'd like to talk about how this limitation on out-of-band information seems both insane and
      impractical, maybe impossible. But then I may go on to explore how actually it makes some
      form of sense. And how you can use this knowledge to write APIs that are easier to code to,
      and whilst not resilient to change in some magical sense, it should allow you to write clients
      that are easier to adapt and update.
    speaker:
      name: Mark Burns
      url: http://twitter.com/_mark_burns
    coverage:
      - type: skillsmatter-video
        url: https://skillsmatter.com/skillscasts/2913-hypermedia-as-the-engine-of-application-state
        title: "SkillsMatter Skillscast : London Ruby User Group : Hypermedia as the Engine of
          Application State"
  usable-apis:
    title: 'Usable APIs'
    description: |-
      With the adoption of REST, the proliferation of smartphones and tablets, and the second
      coming of JavaScript, exposing our applications as a service is now more important than ever.

      Rails or Sinatra make really easy to create a (kinda) RESTful API but, in many occassions,
      these APIs are designed without really thinking on the developers that will have to use them.

      I want to talk about some of the points that can help making your API more
      developer-friendly. Some of the areas I'll cover will be discoverability, authentication,
      headers, formats, parameters, documentation and tools.
    speaker:
      name: Javier Ramirez
      url: http://twitter.com/supercoco9
    coverage:
      - type: skillsmatter-video
        url: https://skillsmatter.com/skillscasts/2914-usable-api
        title: "SkillsMatter Skillscast : London Ruby User Group : Usable APIs"
