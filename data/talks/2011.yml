may:
  ruby-golf:
    title: 'Ruby Golf'
    description: |-
      [Andrew McDonough](http://www.andrewmcdonough.com/) is going to lead a practical evening
      called "Ruby Golf".  He describes it as follows:

      > I started my career as a perl programmer.  Perl, like Ruby has a lot of "syntactic sugar"
      > to help developers write concise code.  Perl programmers sometimes play a game known as
      > "[Perl Golf](http://c2.com/cgi/wiki?PerlGolf)" to explore the lesser-known features of the
      > language.  The aim of "perl golf" is to solve a problem using the fewest characters
      > possible.
      >
      > At this month's meeting Andrew will run a practical evening based around "ruby golf", an
      > adaptation of "perl golf" for ruby developers. People will be asked to form teams of 4-8
      > people, and solve nine short "holes" using as few characters as possible.  Each hole will
      > be defined by a set of [RSpec](http://rspec.info) examples describing a single method, and
      > the teams must write the method to pass all of the examples.  At the end, the solutions
      > will be scored and the winning team will be announced.
      >
      > This evening should have something for everyone; beginners can pick up some language tricks
      > and learn how to write code to pass tests, while experienced ruby developers will have the
      > opportunity to show off their skills and compete with their peers.

      Note: This is going to be a full evening of practical activity.  We'll break up into small
      groups on the night to go through what Andrew has prepared.  You should bring your laptop so
      you can play along.  Don't worry if you don't know anyone, there will be plenty of groups to
      join in on the night.  Also, you should sign up to the [mailing list](/mailing-list) to find
      out about any further instructions.
    speaker:
      name: Andrew McDonough
      url: http://www.andrewmcdonough.com/
    coverage:
      - type: code
        url: https://github.com/andrewmcdonough/rubygolf
        title: GitHub repo for the golf course
