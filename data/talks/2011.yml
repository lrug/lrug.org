august:
  managing-web-application-servers-with-puppet:
    title: Managing Web Application Servers with Puppet
    description: |-
      Joshua Sierles of 37signals once described configuration management as something that
      ["doesn't sound sexy, but it's the single most important thing we do as
      sysadmins"](http://37signals.com/svn/posts/1872-nuts-bolts-configuration-management-with-chef)
      but what is it and what do tools like Chef and Puppet offer from the point of view of a
      developer?

      In this presentation I want to talk about how configuration management allowed me -- a
      developer with no access to the live servers and working with system administrators in
      a different time zone -- to not only install and configure servers quickly and in a
      repeatable way but also let me be confident about the consistency of each and every machine
      I deploy to.

      Using the example of getting a server ready to run a Rails application using
      [Puppet](http://www.puppetlabs.com/) (and testing things out with the aid of
      [Vagrant](http://vagrantup.com/)), I will showcase some patterns that we have developed
      for managing versions of Ruby with RVM, the installation of Phusion Passenger and how to
      deploy a database.yml when you're not allowed to see live passwords.
    speaker:
      name: Paul Mucur
      url: http://mudge.name
    coverage:
      - type: handout
        url: https://github.com/mudge/managing_web_application_servers_with_puppet/tree/master/example
        title: Worked example of Vagrant and Puppet
      - type: slides
        url: https://mudge.name/managing_web_application_servers_with_puppet/
        title: Managing Web Application Servers with Puppet
      - type: transcript
        url: https://mudge.name/2011/08/11/managing-web-application-servers-with-puppet.html
        title: Managing Web Application Servers with Puppet
      - type: skillsmatter-video
        url: https://skillsmatter.com/podcast/home/lrug-puppet
        title: "SkillsMatter Skillscast : London Ruby User Group : Managing Web Applications With
          Puppet"
    custom_intro: describes his talk as follows
  vagrant-and-chef:
    title: Chef and Vagrant
    description: |-
      Most developers spend far too much time managing a development environment that is
      different to the one they use for production applications. Different tools, different
      underlying libraries and different bugs. Local virtualisation provides an answer, but
      historically it's been time consuming and annoying to setup and manage. Using configuration
      management tools like [Chef](http://www.opscode.com/chef/) to set things up, and
      [Vagrant](http://vagrantup.com/) to easily manage the virtual machines from the command
      line provides modern developers the best of all possible worlds.
    speaker:
      name: Gareth Rushgrove
      url: http://morethanseven.net/
    coverage:
      - type: slides
        url: http://morethanseven.net/2011/08/11/Talking-configuration-management-vagrant-and-chef-at-lrug.html
        title: Talking Configuration Management, Vagrant And Chef At LRUG
      - type: skillsmatter-video
        url: https://skillsmatter.com/skillscasts/2512-chef-vagrant
        title: "SkillsMatter Skillscast : London Ruby User Group : Vagrant and Chef"
    custom_intro: |-
      is a sometimes Ruby programmer and occasional sysadmin. He curates the [devopsweekly
      mailing list](http://devopsweekly.com/), lives in Cambridge and writes code for fun and
      profit
