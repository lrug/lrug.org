        url: http://rubygolf-presentation.heroku.com/
      - type: skillsmatter-video
        url: https://skillsmatter.com/skillscasts/2210-ruby-golf
        title: "SkillsMatter Skillscast : London Ruby User Group : Ruby Golf"
    use_description_as_intro: true
