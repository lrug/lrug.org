  adventures-with-data-structures-and-algorithms:
    title: Adventures with data structures and algorithms
    description: |-
      Hola amigos! We need to have a chat about data structures
      and algorithms. I've been messing around with them on-and-off
      over the past few years and I believe you'll find spending
      more time learning them valuable. Here's what I'm going to
      talk about:

      * Why you should bother learning about them at all, especially if you think you won't
        use them at work.
      * Some fun examples of data structures/algos you've heard of (and probably some you haven't)
        and how they're put to work in software you use every day.
      * Ways of learning them that I've found to be fun and effective.

      I swear in the name of [Knuth](https://en.wikipedia.org/wiki/Donald_Knuth) that there
      shall be no mention of big-o notation or sorting algorithms. Also, I will attempt a
      live demo of one of the algos using the SATR transport protocol. It probably won't work
      if you are good at the maths and feeling mischievous.

      *[SATR]: Shout Across The Room
    speaker:
      name: Najaf Ali
      url: http://happybearsoftware.com/
    coverage:
