      will present some code from [my final project](https://github.com/dan-mi-sun/the-soul-at-work)
      of the 12 week training course / some code recently pulled into
      [Diaspora*](https://www.joindiaspora.com/). With more and more of us choosing this route,
      the aim is to show those interested in the 'Immersion' model (either attending a course,
      or hiring someone who has joined a course) what someone with no prior coding experience can
      achieve within 12 weeks.
    speaker:
      name: Daniel Sun
      url: http://danielsun.co.uk/
    coverage:
      - type: skillsmatter-video
        url: https://skillsmatter.com/skillscasts/5709-learn-to-code-in-12-weeks
        title: 'Skills Matter : London Ruby User Group : Learn to code in 12 weeks?'
october:
  be-a-good-unix-citizen:
    title: Be a good UNIX citizen
    description: |-
      The Unix command line has been the foundation of how
      we use computers for over four decades, and has
      changed surprisingly little in that time. I'll look at
      what it takes to elevate a throwaway one-liner or
      personal script into a robust and re-usable CLI app,
      and look at the Ruby techniques that make it easy to
      be a good Unix citizen.
    speaker:
      name: Rob Miller
      url: https://robm.me.uk/
    coverage:
      - type: slides
        url: https://robm.me.uk/talks/2014-10-well-behaved-unix.pdf
        title: Writing Well-Behaved Unix Utilities in Ruby
      - type: skillsmatter-video
        url: https://skillsmatter.com/skillscasts/5808-be-a-good-unix-citizen
        title: 'Skills Matter : London Ruby User Group : Be a good UNIX citizen'
  live-coding-in-the-classroom:
    title: Live Coding in the Classroom
    description: |-
      [Sonic Pi](http://sonic-pi.net/) is a Ruby-based live coding music
      synthesiser designed to help teach both computing
      and music within schools. It uses fast feedback,
      liveness and studio-quality sound production as a
      means to engage school children in introductory
      coding. In this talk we will follow the story of
      Sonic Pi from its the humble beginnings of this
      project in a single class of school-children coding
      beeps and bleeps to its current standing as a
      state-of-the-art live coding system installed by
      default on all Raspberry Pis  used to live code
      in a variety of venues from Algoraves to national
      music venues.  All towards a simple but deep
      question - how can we give more people an understanding
      of what programming is and can do?
    speaker:
      - name: Sam Aaron
        url: http://sam.aaron.name/
      - name: Xavier Riley
        url: http://xavierriley.co.uk/
    custom_intro: want to code up some music for us
    coverage:
      - type: skillsmatter-video
        url: https://skillsmatter.com/skillscasts/5809-live-coding-in-the-classroom
        title: 'Skills Matter : London Ruby User Group : Live Coding in the Classroom'
november:
  julia-fast-and-dynamic:
    title: Julia  - Fast and Dynamic
    description: |-
      Can a programming language be fast yet highly dynamic? The creators
      of Julia, a new language with a numeric focus intends to answer yes.

      In this talk we will introduce the language, and discuss some of its design and
      implementation decisions that make it particularly amenable to generating
      efficient machine code. We will also talk about Julia's impressive language
      interop features, and see examples of calling Ruby code from within Julia.
    speaker:
      name: Avik Sengupta
      url: http://www.sengupta.net/musings/
    custom_intro: wants to introduce us to a new language called [Julia](http://julialang.org/)
    coverage:
      - type: skillsmatter-video
        url: https://skillsmatter.com/skillscasts/5927-julia-fast-and-dynamic
        title: 'Skills Matter : London Ruby User Group : Julia  - Fast and Dynamic'
  peas-a-docker-and-ruby-based-paas:
    title: Peas - A Docker and Ruby based PaaS
    description: |-
      I'll be looking at the basic technical concepts of the Platform As A Service
      paradigm (eg; Heroku) and what Docker and Ruby can contribute to it. Some of
      the highlights will be; using Docker inside Docker, how to test this complex
      stack and concurrency using the Celluloid gem.
    speaker:
      name: Thomas Buckley-Houston
      url: http://tombh.co.uk
    coverage:
      - type: skillsmatter-video
        url: https://skillsmatter.com/skillscasts/5928-peas-a-docker-and-ruby-based-paas
        title: 'Skills Matter : London Ruby User Group : Peas - A Docker and Ruby based
          PaaS'
december:
  are-you-sure-its-right:
    title: Are you sure it's right?
    description: |-
      This talk on both Rails and plain Ruby apps will cover

      * Testing
      * Code standards tools
      * Validations and verifications
      * Security tools and frameworks
    speaker:
      name: Owen Ben Davies
      url: http://www.obduk.com/
    coverage:
      - type: skillsmatter-video
        url: https://skillsmatter.com/skillscasts/6078-are-you-sure-its-right
        title: 'Skills Matter : London Ruby User Group : Are you sure it''s right?'
    custom_intro: wants us to think about what is and what isn't right with our software
  an-rspec-3-talk:
    title: An RSpec 3 Talk
    description: |-
      RSpec 3 is the recently released new major version of RSpec. It contains a host
      of new features, and has removed or altered many old ones. In this talk we’ll
      cover the most significant changes that were made in RSpec 3, the upgrade path
      between RSpec 2 and 3 and some of the common pitfalls that you might fall into
      when using this new major version of RSpec.
    speaker:
      name: Sam Phippen
      url: http://samphippen.com/
    coverage:
      - type: skillsmatter-video
        url: https://skillsmatter.com/skillscasts/6079-an-rspec-3-talk
        title: 'Skills Matter : London Ruby User Group : An RSpec 3 Talk'
